[package]
name = "afrn-v5"
version = "0.1.0"
edition = "2024"
description = "Budgeted byte program induction with document-local associative memory"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
